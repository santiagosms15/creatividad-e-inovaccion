<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Calculadora Financiera</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

    :root {
      --primary: #0f172a;
      --secondary: #1e293b;
      --accent: #3b82f6;
      --success: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --card-bg: #1e293b;
      --border: #334155;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: url("img/fondo5.jpg") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      padding: 40px 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px var(--shadow);
      border: 1px solid var(--border);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: var(--text-primary);
      margin-bottom: 32px;
      font-size: 2em;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .calculator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9em;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--primary);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1em;
      color: var(--text-primary);
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      width: 100%;
      grid-column: 1 / -1;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 16px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .back-btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--secondary);
      color: var(--text-secondary);
      font-size: 1em;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      text-decoration: none;
      margin-bottom: 25px;
    }

    .back-btn:hover {
      background-color: var(--accent);
      color: var(--text-primary);
    }

    .results-container {
      margin-top: 32px;
      background: var(--primary);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: none;
      /* Oculto por defecto */
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .result-item h3 {
      font-size: 0.9em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .result-item .value {
      font-size: 1.75em;
      font-weight: 700;
    }

    #finalBalance.value {
      color: var(--success);
    }

    .chart-container {
      height: 200px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .chart-bar {
      flex-grow: 1;
      background: var(--accent);
      border-radius: 4px 4px 0 0;
      transition: height 0.5s ease-out;
      position: relative;
      text-align: center;
    }

    .chart-bar .label {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8em;
      color: var(--text-secondary);
      width: 100px;
    }

    #barInitial {
      background: #3b82f6;
    }

    #barContributions {
      background: #10b981;
    }

    #barInterest {
      background: #f59e0b;
    }

    @media (max-width: 600px) {
      .calculator-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>🧮 Calculadora de Interés Compuesto</h1>
      <button class="btn back-btn" onclick="backToMenu()">
        ← Volver al Menú
      </button>
      <div class="calculator-grid">
        <div class="form-group">
          <label for="initialAmount">Monto Inicial ($)</label>
          <input type="number" id="initialAmount" value="1000" />
        </div>
        <div class="form-group">
          <label for="monthlyContribution">Aporte Mensual ($)</label>
          <input type="number" id="monthlyContribution" value="100" />
        </div>
        <div class="form-group">
          <label for="interestRate">Tasa de Interés Anual (%)</label>
          <input type="number" id="interestRate" value="7" />
        </div>
        <div class="form-group">
          <label for="years">Período (Años)</label>
          <input type="number" id="years" value="10" />
        </div>
        <button class="btn" onclick="calculateInterest()">Calcular</button>
      </div>

      <div class="results-container" id="results">
        <div class="results-grid">
          <div class="result-item">
            <h3>Saldo Final</h3>
            <div class="value" id="finalBalance">$0</div>
          </div>
          <div class="result-item">
            <h3>Total Aportado</h3>
            <div class="value" id="totalContributions">$0</div>
          </div>
          <div class="result-item">
            <h3>Intereses Ganados</h3>
            <div class="value" id="interestEarned">$0</div>
          </div>
        </div>
        <div class="chart-container">
          <div class="chart-bar" id="barInitial"><span class="label">Capital Inicial</span></div>
          <div class="chart-bar" id="barContributions"><span class="label">Aportaciones</span></div>
          <div class="chart-bar" id="barInterest"><span class="label">Intereses</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatCurrency(value) {
      return new Intl.NumberFormat("es-CO", {
        style: "currency",
        currency: "COP",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(value);
    }

    function calculateInterest() {
      const initial = parseFloat(document.getElementById("initialAmount").value) || 0;
      const monthly = parseFloat(document.getElementById("monthlyContribution").value) || 0;
      const rate = parseFloat(document.getElementById("interestRate").value) / 100 || 0;
      const years = parseInt(document.getElementById("years").value) || 0;

      const monthlyRate = rate / 12;
      const months = years * 12;

      let futureValue = initial * Math.pow(1 + monthlyRate, months);
      if (monthly > 0 && monthlyRate > 0) {
        futureValue += monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
      } else {
        futureValue += monthly * months;
      }

      const totalContributed = initial + monthly * months;
      const interest = futureValue - totalContributed;

      document.getElementById("finalBalance").textContent = formatCurrency(futureValue);
      document.getElementById("totalContributions").textContent = formatCurrency(totalContributed);
      document.getElementById("interestEarned").textContent = formatCurrency(interest);

      // Update chart
      const total = futureValue;
      const initialPercent = (initial / total) * 100;
      const contributionsPercent = ((monthly * months) / total) * 100;
      const interestPercent = (interest / total) * 100;

      document.getElementById("barInitial").style.height = `${initialPercent}%`;
      document.getElementById("barContributions").style.height = `${contributionsPercent}%`;
      document.getElementById("barInterest").style.height = `${interestPercent}%`;

      document.getElementById("results").style.display = "block";
    }
    function backToMenu() {
      window.location.href = "dashboard.html";
    }
  </script>
</body>

</html>
