<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Calculadora Financiera</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

      :root {
        --primary: #0f172a;
        --secondary: #1e293b;
        --accent: #3b82f6;
        --success: #10b981;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --card-bg: #1e293b;
        --border: #334155;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: url("img/fondo5.jpg") no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        padding: 20px 16px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .container {
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .card {
        background: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 32px var(--shadow);
        border: 1px solid var(--border);
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        color: var(--text-primary);
        margin-bottom: 24px;
        font-size: 1.5em;
        font-weight: 700;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .calculator-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .form-group {
        margin-bottom: 0;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.9em;
      }

      .form-group input {
        width: 100%;
        padding: 12px 14px;
        background: var(--primary);
        border: 2px solid var(--border);
        border-radius: 10px;
        font-size: 1em;
        color: var(--text-primary);
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 8px;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .back-btn {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background-color: var(--secondary);
        color: var(--text-secondary);
        font-size: 0.9em;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
        text-decoration: none;
        margin-bottom: 20px;
      }

      .back-btn:hover {
        background-color: var(--accent);
        color: var(--text-primary);
      }

      .results-container {
        margin-top: 24px;
        background: var(--primary);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        display: none;
      }

      .results-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 24px;
      }

      .result-item {
        text-align: center;
        padding: 16px;
        background: var(--secondary);
        border-radius: 8px;
      }

      .result-item h3 {
        font-size: 0.85em;
        color: var(--text-secondary);
        margin-bottom: 8px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .result-item .value {
        font-size: 1.5em;
        font-weight: 700;
      }

      #finalBalance.value {
        color: var(--success);
      }

      .chart-container {
        height: 180px;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        border-bottom: 2px solid var(--border);
        padding-bottom: 40px;
        margin-top: 20px;
      }

      .chart-bar {
        flex: 1;
        background: var(--accent);
        border-radius: 6px 6px 0 0;
        transition: height 0.5s ease-out;
        position: relative;
        min-height: 20px;
      }

      .chart-bar .label {
        position: absolute;
        bottom: -35px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7em;
        color: var(--text-secondary);
        width: 80px;
        text-align: center;
        line-height: 1.2;
      }

      #barInitial {
        background: #3b82f6;
      }

      #barContributions {
        background: #10b981;
      }

      #barInterest {
        background: #f59e0b;
      }

      /* Tablet */
      @media (min-width: 600px) {
        body {
          padding: 40px 20px;
        }

        .card {
          padding: 32px;
        }

        h1 {
          font-size: 1.8em;
          margin-bottom: 28px;
        }

        .calculator-grid {
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }

        .btn {
          grid-column: 1 / -1;
          padding: 16px;
          font-size: 1.1em;
          margin-top: 12px;
        }

        .results-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .result-item .value {
          font-size: 1.75em;
        }

        .chart-container {
          height: 200px;
        }

        .chart-bar .label {
          font-size: 0.8em;
          width: 100px;
        }
      }

      /* Desktop */
      @media (min-width: 900px) {
        .card {
          padding: 40px;
        }

        h1 {
          font-size: 2em;
          margin-bottom: 32px;
        }

        .calculator-grid {
          gap: 24px;
        }

        .results-container {
          padding: 32px;
          margin-top: 32px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>🧮 Calculadora de Interés Compuesto</h1>
        <button class="btn back-btn" onclick="backToMenu()">
          ← Volver al Menú
        </button>
        <div class="calculator-grid">
          <div class="form-group">
            <label for="initialAmount">Monto Inicial (COP)</label>
            <input type="number" id="initialAmount" value="1000" />
          </div>
          <div class="form-group">
            <label for="monthlyContribution">Aporte Mensual (COP)</label>
            <input type="number" id="monthlyContribution" value="100" />
          </div>
          <div class="form-group">
            <label for="interestRate">Tasa de Interés Anual (%)</label>
            <input type="number" id="interestRate" value="7" />
          </div>
          <div class="form-group">
            <label for="years">Período en Años</label>
            <input type="number" id="years" value="10" />
          </div>
          <button class="btn" id="calculateBtn" onclick="calculateInterest()">
            Calcular
          </button>
        </div>

        <div class="results-container" id="results">
          <div class="results-grid">
            <div class="result-item">
              <h3>Saldo Final</h3>
              <div class="value" id="finalBalance">$0</div>
            </div>
            <div class="result-item">
              <h3>Total Aportado</h3>
              <div class="value" id="totalContributions">$0</div>
            </div>
            <div class="result-item">
              <h3>Intereses Ganados</h3>
              <div class="value" id="interestEarned">$0</div>
            </div>
          </div>
          <div class="chart-container">
            <div class="chart-bar" id="barInitial">
              <span class="label">Capital Inicial</span>
            </div>
            <div class="chart-bar" id="barContributions">
              <span class="label">Aportaciones</span>
            </div>
            <div class="chart-bar" id="barInterest">
              <span class="label">Intereses</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function formatCurrency(value) {
        return new Intl.NumberFormat("es-CO", {
          style: "currency",
          currency: "COP",
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }).format(value);
      }

      function calculateInterest() {
        const initial =
          parseFloat(document.getElementById("initialAmount").value) || 0;
        const monthly =
          parseFloat(document.getElementById("monthlyContribution").value) || 0;
        const rate =
          parseFloat(document.getElementById("interestRate").value) / 100 || 0;
        const years = parseInt(document.getElementById("years").value) || 0;

        const monthlyRate = rate / 12;
        const months = years * 12;

        let futureValue = initial * Math.pow(1 + monthlyRate, months);
        if (monthly > 0 && monthlyRate > 0) {
          futureValue +=
            monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
        } else {
          futureValue += monthly * months;
        }

        const totalContributed = initial + monthly * months;
        const interest = futureValue - totalContributed;

        document.getElementById("finalBalance").textContent =
          formatCurrency(futureValue);
        document.getElementById("totalContributions").textContent =
          formatCurrency(totalContributed);
        document.getElementById("interestEarned").textContent =
          formatCurrency(interest);

        // Update chart
        const total = futureValue;
        const initialPercent = Math.max((initial / total) * 100, 10);
        const contributionsPercent = Math.max(
          ((monthly * months) / total) * 100,
          10
        );
        const interestPercent = Math.max((interest / total) * 100, 10);

        document.getElementById("barInitial").style.height =
          `${initialPercent}%`;
        document.getElementById("barContributions").style.height =
          `${contributionsPercent}%`;
        document.getElementById("barInterest").style.height =
          `${interestPercent}%`;

        document.getElementById("results").style.display = "block";

        // Smooth scroll to results on mobile
        setTimeout(() => {
          document
            .getElementById("results")
            .scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 100);
      }

      function backToMenu() {
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
