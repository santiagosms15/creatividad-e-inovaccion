<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>FinanSYS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI Variable", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background-image: url("img/fondo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* Shapes */
    .background-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
    }

    .shape1 {
      width: 40vw;
      height: 40vw;
      background: #4a8886;
      bottom: -10vw;
      left: -5vw;
      border-radius: 40% 60% 50% 50%;
      animation: float 15s ease-in-out infinite;
    }

    .shape2 {
      width: 28vw;
      height: 28vw;
      background: #5a9896;
      top: -5vw;
      right: -3vw;
      border-radius: 50% 50% 40% 60%;
      animation: float 12s ease-in-out infinite reverse;
    }

    .shape3 {
      width: 55vw;
      height: 55vw;
      background: #3d7573;
      bottom: -15vw;
      right: -10vw;
      border-radius: 60% 40% 50% 50%;
      animation: float 18s ease-in-out infinite;
    }

    /* Contenido */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      text-align: center;
    }

    .logo-img {
      width: clamp(200px, 40vw, 550px);
      margin-bottom: 40px;
    }

    .tagline {
      color: white;
      font-size: clamp(1.2rem, 2vw, 1.9rem);
      max-width: 700px;
      margin-bottom: 40px;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .form-container {
      width: 100%;
      max-width: 380px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: clamp(12px, 3vw, 18px) clamp(18px, 3vw, 25px);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      backdrop-filter: blur(10px);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn-submit {
      width: 100%;
      padding: clamp(12px, 3vw, 18px);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      color: white;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      font-weight: 300;
      backdrop-filter: blur(10px);
    }

    .register-link {
      margin-top: 20px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .register-link a {
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Animaciones */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container>* {
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* 📱 RESPONSIVE PARA CELULARES */
    @media (max-width: 768px) {
      .shape1 {
        width: 55vw;
        height: 55vw;
      }

      .shape2 {
        width: 35vw;
        height: 35vw;
      }

      .shape3 {
        width: 65vw;
        height: 65vw;
      }

      .tagline {
        margin-bottom: 30px;
      }
    }

    @media (max-width: 480px) {
      .shape1 {
        width: 70vw;
        height: 70vw;
      }

      .shape2 {
        width: 45vw;
        height: 45vw;
      }

      .shape3 {
        width: 80vw;
        height: 80vw;
      }

      .tagline {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Shapes -->

  <div class="container">
    <img src="img/LogoFinanSYS.png" class="logo-img" alt="logo" />

    <p class="tagline">
      ¿Sabes en qué se te va cada peso, o solo te das cuenta cuando ya es demasiado tarde?
    </p>

    <div class="form-container">
      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="usuario" placeholder="Usuario" required />
        </div>
        <div class="input-group">
          <input type="password" id="contrasena" placeholder="Contraseña" required />
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
      </form>

      <p class="register-link">
        ¿No tienes cuenta? <a href="/registro" id="registerLink">Regístrate aquí</a>
      </p>
      <p class="register-link">
        <a href="/recuperar">¿Olvidaste tu contraseña?</a>
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const usuarioInput = document.getElementById("usuario");
    const contrasenaInput = document.getElementById("contrasena");
    const registerLink = document.getElementById("registerLink");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const usuario = usuarioInput.value.trim();
      const contrasena = contrasenaInput.value;

      if (!usuario || !contrasena) {
        alert("Por favor, completa todos los campos");
        return;
      }

      if (contrasena.length < 6) {
        alert("La contraseña debe tener al menos 6 caracteres");
        return;
      }

      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, contrasena }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.success) {
            alert(`Bienvenido, ${data.usuario.nombre}`);
            sessionStorage.setItem("usuario", JSON.stringify(data.usuario));
            window.location.href = "/dashboard";
          } else {
            alert("Error: " + data.message);
          }
        })
        .catch(() => alert("No se pudo conectar con el servidor."));
    });
  </script>
</body>

</html>
