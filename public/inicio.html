<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>FinanSYS</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI Variable", "Segoe UI", Tahoma, Geneva, Verdana,
          sans-serif;
        min-height: 100vh;
        background-image: url("img/fondo.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
      }

      /* Shapes - Optimizadas para móvil */
      .background-shapes {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }

      .shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.15;
      }

      .shape1 {
        width: 40vw;
        height: 40vw;
        background: #4a8886;
        bottom: -10vw;
        left: -5vw;
        border-radius: 40% 60% 50% 50%;
        animation: float 15s ease-in-out infinite;
      }

      .shape2 {
        width: 28vw;
        height: 28vw;
        background: #5a9896;
        top: -5vw;
        right: -3vw;
        border-radius: 50% 50% 40% 60%;
        animation: float 12s ease-in-out infinite reverse;
      }

      .shape3 {
        width: 55vw;
        height: 55vw;
        background: #3d7573;
        bottom: -15vw;
        right: -10vw;
        border-radius: 60% 40% 50% 50%;
        animation: float 18s ease-in-out infinite;
      }

      /* Contenido */
      .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
        text-align: center;
      }

      .logo-img {
        width: clamp(180px, 40vw, 550px);
        margin-bottom: clamp(20px, 5vh, 40px);
        max-width: 90%;
      }

      .tagline {
        color: white;
        font-size: clamp(1rem, 4vw, 2rem);
        font-weight: 600;
        max-width: 700px;
        margin-bottom: clamp(25px, 5vh, 40px);
        line-height: 1.5;
        letter-spacing: 0.3px;
        text-shadow: 0 3px 15px rgba(0, 0, 0, 0.6);
        padding: 0 10px;
      }

      .form-container {
        width: 100%;
        max-width: 380px;
        padding: 0 10px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      input {
        width: 100%;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50px;
        color: white;
        backdrop-filter: blur(10px);
        font-size: clamp(0.9rem, 3vw, 1rem);
        transition: all 0.3s ease;
        -webkit-appearance: none;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      input:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.7);
        outline: none;
      }

      /* Botón de mostrar contraseña */
      .password-wrapper {
        position: relative;
      }

      #togglePassword {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font-size: 1.2rem;
        padding: 8px;
        z-index: 2;
        touch-action: manipulation;
      }

      #togglePassword:active {
        transform: translateY(-50%) scale(0.95);
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50px;
        color: white;
        font-size: clamp(0.95rem, 3vw, 1.1rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.3s ease;
        font-weight: 300;
        backdrop-filter: blur(10px);
        touch-action: manipulation;
      }

      .btn-submit:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.7);
      }

      .btn-submit:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn-submit:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .register-link {
        margin-top: 18px;
        font-size: clamp(0.85rem, 3vw, 0.95rem);
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.6;
      }

      .register-link a {
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        transition: all 0.2s;
      }

      .register-link a:active {
        opacity: 0.7;
      }

      /* Estilos para mensajes de error */
      .error-message {
        color: #ffdddd;
        font-size: clamp(0.75rem, 2.5vw, 0.85rem);
        margin-top: 5px;
        text-align: left;
        padding-left: 20px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        min-height: 1.2em;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* Animaciones */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(5deg);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container > * {
        animation: fadeIn 0.8s ease-out forwards;
      }

      /* 📱 RESPONSIVE MEJORADO */
      @media (max-width: 768px) {
        body {
          background-attachment: scroll;
        }

        .shape1 {
          width: 60vw;
          height: 60vw;
        }

        .shape2 {
          width: 40vw;
          height: 40vw;
        }

        .shape3 {
          width: 70vw;
          height: 70vw;
        }

        .container {
          padding: 15px;
        }

        input {
          padding: 13px 18px;
        }

        .btn-submit {
          padding: 13px;
        }
      }

      @media (max-width: 480px) {
        .shape1 {
          width: 75vw;
          height: 75vw;
        }

        .shape2 {
          width: 50vw;
          height: 50vw;
        }

        .shape3 {
          width: 85vw;
          height: 85vw;
        }

        .logo-img {
          margin-bottom: 20px;
        }

        .tagline {
          margin-bottom: 25px;
        }

        input {
          padding: 12px 16px;
        }

        #togglePassword {
          right: 12px;
          font-size: 1.1rem;
          padding: 6px;
        }

        .btn-submit {
          padding: 12px;
          font-size: 0.95rem;
        }

        .input-group {
          margin-bottom: 12px;
        }

        .register-link {
          margin-top: 15px;
        }
      }

      /* Para pantallas MUY pequeñas */
      @media (max-width: 360px) {
        .container {
          padding: 10px;
        }

        .logo-img {
          width: 160px;
        }

        .form-container {
          padding: 0 5px;
        }
      }

      /* Mejoras para landscape en móvil */
      @media (max-height: 600px) and (orientation: landscape) {
        .container {
          padding: 10px;
          justify-content: flex-start;
          padding-top: 20px;
        }

        .logo-img {
          width: 150px;
          margin-bottom: 10px;
        }

        .tagline {
          font-size: 0.9rem;
          margin-bottom: 15px;
        }

        .input-group {
          margin-bottom: 10px;
        }

        input,
        .btn-submit {
          padding: 10px 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="img/LogoFinanSYS.png" class="logo-img" alt="logo" />

      <p class="tagline">
        ¿Sabes en qué se te va cada peso, o solo te das cuenta cuando ya es
        demasiado tarde?
      </p>

      <div class="form-container">
        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="usuario" class="visually-hidden">Usuario</label>
            <input
              type="text"
              id="usuario"
              placeholder="Usuario"
              required
              autocomplete="username"
            />
            <div class="error-message" id="usuarioError"></div>
          </div>
          <div class="input-group password-wrapper">
            <label for="contrasena" class="visually-hidden">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              placeholder="Contraseña"
              required
              autocomplete="current-password"
              style="padding-right: 50px"
            />
            <button
              type="button"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >
              👁️
            </button>
            <div class="error-message" id="contrasenaError"></div>
          </div>
          <button type="submit" class="btn-submit" id="submitButton">
            Iniciar Sesión
          </button>
        </form>

        <p class="register-link">
          ¿No tienes cuenta?
          <a href="/registro" id="registerLink">Regístrate aquí</a>
        </p>
        <p class="register-link">
          <a href="/recuperar">¿Olvidaste tu contraseña?</a>
        </p>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const usuarioInput = document.getElementById("usuario");
      const contrasenaInput = document.getElementById("contrasena");
      const submitButton = document.getElementById("submitButton");
      const usuarioError = document.getElementById("usuarioError");
      const contrasenaError = document.getElementById("contrasenaError");

      const showError = (element, message) => {
        element.textContent = message;
      };

      const clearErrors = () => {
        usuarioError.textContent = "";
        contrasenaError.textContent = "";
      };

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearErrors();

        const usuario = usuarioInput.value.trim();
        const contrasena = contrasenaInput.value;
        let isValid = true;

        if (!usuario) {
          showError(usuarioError, "Por favor, ingresa tu usuario.");
          isValid = false;
        }

        if (!contrasena) {
          showError(contrasenaError, "Por favor, ingresa tu contraseña.");
          isValid = false;
        } else if (contrasena.length < 6) {
          showError(
            contrasenaError,
            "La contraseña debe tener al menos 6 caracteres."
          );
          isValid = false;
        }

        if (!isValid) {
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Iniciando...";

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, contrasena }),
        })
          .then((res) => {
            if (!res.ok) {
              return res.json().then((err) => Promise.reject(err));
            }
            return res.json();
          })
          .then((data) => {
            localStorage.clear();
            sessionStorage.clear();
            sessionStorage.setItem("usuario", JSON.stringify(data.usuario));
            window.location.href = "/dashboard";
          })
          .catch((err) => {
            showError(
              contrasenaError,
              err.message || "Usuario o contraseña incorrectos."
            );
            submitButton.disabled = false;
            submitButton.textContent = "Iniciar Sesión";
          });
      });

      const togglePassword = document.getElementById("togglePassword");
      togglePassword.addEventListener("click", function () {
        const type = contrasenaInput.type === "password" ? "text" : "password";
        contrasenaInput.type = type;
        this.textContent = type === "password" ? "👁️" : "🙈";
      });
    </script>
  </body>
</html>
